<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>React</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0B1116">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="splash-screen" class="splash-screen">
    <img src="./icons/icon.svg" alt="React" class="splash-logo">
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-btn" class="menu-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <h1 id="app-title">React</h1>
    </div>
    <div class="topbar-right">
      <span id="day-counter">DAG — / 42</span>
      <button id="glossary-btn" class="glossary-btn" aria-label="Forklaring af forkortelser">?</button>
    </div>
  </header>

  <main id="view-training" class="view active">
  </main>

  <main id="view-food" class="view">
  </main>

  <nav class="tabbar">
    <button data-view="training" class="tab-btn active">TRÆNING</button>
    <button data-view="food" class="tab-btn">KOST</button>
  </nav>

  <main id="view-dashboard" class="view">
    <div class="dashboard-section-title">Træning i dag</div>
    <div class="dashboard-card card--bracket">
      <div class="dashboard-card-label" id="dashboard-day-label"></div>
      <div class="dashboard-week-heading" id="dashboard-week-label"></div>
      <div class="dashboard-phase" id="dashboard-phase"></div>
      <div class="dashboard-sessions" id="dashboard-sessions"></div>
      <div class="dashboard-progress-bar"><div class="dashboard-progress-fill" id="dashboard-progress-fill"></div></div>
      <div class="dashboard-progress-label" id="dashboard-progress-label"></div>
      <button id="start-day-btn" class="dashboard-btn dashboard-btn--primary">ÅBN TRÆNING</button>
    </div>

    <div class="dashboard-section-title">Kost i dag</div>
    <div class="dashboard-card dashboard-card--dashed">
      <div class="dashboard-card-label" id="dashboard-kost-day-label"></div>
      <div class="dashboard-kost-empty" id="dashboard-kost-summary"></div>
      <button id="food-day-btn" class="dashboard-btn dashboard-btn--secondary">ÅBN KOST</button>
    </div>

    <div class="dashboard-section-title">Denne uge</div>
    <div class="dashboard-card">
      <div class="dashboard-week-nav">
        <button id="week-prev-btn" class="dashboard-week-arrow" aria-label="Forrige uge">‹</button>
        <div class="dashboard-week-range" id="dashboard-week-range"></div>
        <button id="week-next-btn" class="dashboard-week-arrow" aria-label="Næste uge">›</button>
      </div>
      <div class="dashboard-week-strip" id="dashboard-week-strip"></div>
    </div>

    <div class="dashboard-section-title">Fremgang</div>
    <div class="dashboard-card">
      <div class="dashboard-stats-row">
        <div class="dashboard-stat">
          <div class="dashboard-stat-value" id="stat-sets"></div>
          <div class="dashboard-stat-label">Sæt denne uge</div>
        </div>
        <div class="dashboard-stat">
          <div class="dashboard-stat-value" id="stat-streak"></div>
          <div class="dashboard-stat-label">Dages streak</div>
        </div>
        <div class="dashboard-stat">
          <div class="dashboard-stat-value" id="stat-program"></div>
          <div class="dashboard-stat-label">Program</div>
        </div>
      </div>
    </div>
  </main>

  <div id="glossary-overlay" class="glossary-overlay hidden">
    <div class="glossary-panel">
      <button id="glossary-close-btn" class="glossary-close-btn" aria-label="Luk">×</button>
      <div id="glossary-content"></div>
    </div>
  </div>

  <div id="menu-overlay" class="menu-overlay hidden">
    <div class="menu-panel">
      <button id="menu-close-btn" class="menu-close-btn" aria-label="Luk">×</button>
      <div id="menu-content"></div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/data/exercises.js"></script>
  <script src="./js/data/foods.js"></script>
  <script src="./js/data/schedule.js"></script>
  <script src="./js/data/formGuide.js"></script>
  <script src="./js/program.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
