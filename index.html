<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>React</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0B1116">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-btn" class="menu-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <h1 id="app-title">React</h1>
    </div>
    <div class="topbar-right">
      <span id="day-counter">DAG — / 42</span>
      <button id="glossary-btn" class="glossary-btn" aria-label="Forklaring af forkortelser">?</button>
    </div>
  </header>

  <main id="view-training" class="view active">
  </main>

  <main id="view-food" class="view">
  </main>

  <nav class="tabbar">
    <button data-view="training" class="tab-btn active">TRÆNING</button>
    <button data-view="food" class="tab-btn">KOST</button>
  </nav>

  <div id="dashboard-overlay" class="dashboard-overlay hidden">
    <div class="dashboard-content">
      <img src="./icons/icon.svg" alt="React" class="dashboard-logo">
      <div class="dashboard-today">
        <div id="dashboard-day" class="dashboard-day"></div>
        <div id="dashboard-phase" class="dashboard-phase"></div>
        <div id="dashboard-sessions" class="dashboard-sessions"></div>
        <div id="dashboard-progress" class="dashboard-progress"></div>
      </div>
      <div class="dashboard-actions">
        <button id="start-day-btn" class="dashboard-btn dashboard-btn--primary">START DAG 1</button>
        <button id="food-day-btn" class="dashboard-btn dashboard-btn--secondary">KOST DAG 1</button>
      </div>
    </div>
  </div>

  <div id="glossary-overlay" class="glossary-overlay hidden">
    <div class="glossary-panel">
      <button id="glossary-close-btn" class="glossary-close-btn" aria-label="Luk">×</button>
      <div id="glossary-content"></div>
    </div>
  </div>

  <div id="menu-overlay" class="menu-overlay hidden">
    <div class="menu-panel">
      <button id="menu-close-btn" class="menu-close-btn" aria-label="Luk">×</button>
      <div id="menu-content"></div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/data/exercises.js"></script>
  <script src="./js/data/schedule.js"></script>
  <script src="./js/data/formGuide.js"></script>
  <script src="./js/program.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
