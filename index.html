<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>React</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0B1116">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>React</h1>
    <div class="topbar-right">
      <span id="day-counter">DAG — / 42</span>
      <button id="glossary-btn" class="glossary-btn" aria-label="Forklaring af forkortelser">?</button>

  <main id="view-training" class="view active">
  </main>

  <main id="view-food" class="view">
  </main>

  <main id="view-menu" class="view">
  </main>

  <nav class="tabbar">
    <button data-view="training" class="tab-btn active">TRÆNING</button>
    <button data-view="food" class="tab-btn">KOST</button>
    <button data-view="menu" class="tab-btn">MENU</button>

  <div id="start-overlay" class="start-overlay hidden">
    <button id="start-day-btn">START DAG 1</button>
  </div>

  <div id="glossary-overlay" class="glossary-overlay hidden">

      <button id="glossary-close-btn" class="glossary-close-btn" aria-label="Luk">×</button>
      <div id="glossary-content"></div>

  </div>

  <script src="./js/config.js"></script>
  <script src="./js/data/exercises.js"></script>
  <script src="./js/data/schedule.js"></script>
  <script src="./js/data/formGuide.js"></script>
